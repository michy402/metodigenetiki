const letters = ["1","2","3","4","5"];
const quiz = document.getElementById('quiz');
const answeredEl = document.getElementById('answered');
const scoreEl = document.getElementById('score');
const errorsEl = document.getElementById('errors');
const totalEl = document.getElementById('total');
const finalBox = document.getElementById('finalBox');

let answeredCount = 0;
let score = 0;
let errors = 0;

function build() {
  answeredCount = 0; score = 0; errors = 0;
  answeredEl.textContent = 0; scoreEl.textContent = 0; errorsEl.textContent = 0;
  finalBox.textContent = '';
  quiz.innerHTML = '';
  totalEl.textContent = data.length;

  data.forEach((item, idx) => {
    const [text, options, correct] = item;
    const qDiv = document.createElement('div');
    qDiv.className = 'q';
    qDiv.dataset.done = '0';
    qDiv.innerHTML = `<div class="q-text">${idx + 1}) ${text}</div>`;

    options.forEach((opt, i) => {
      if (!opt.trim()) return;
      const aDiv = document.createElement('div');
      aDiv.className = 'answer';
      aDiv.textContent = letters[i] + ') ' + opt;
      aDiv.dataset.idx = i;
      aDiv.addEventListener('click', () => {
        if (qDiv.dataset.done === '1') return;
        qDiv.dataset.done = '1';
        const all = qDiv.querySelectorAll('.answer');
        all.forEach(a => a.classList.add('disabled'));

        if (i === correct) {
          aDiv.classList.add('correct');
          score++; scoreEl.textContent = score;
        } else {
          aDiv.classList.add('wrong');
          errors++; errorsEl.textContent = errors;
          all.forEach(a => {
            if (Number(a.dataset.idx) === correct) a.classList.add('correct');
          });
        }
        answeredCount++; answeredEl.textContent = answeredCount;
        checkFinish();
      });
      qDiv.appendChild(aDiv);
    });

    quiz.appendChild(qDiv);
  });
}
function checkFinish() {
  if (answeredCount === data.length) {
    const pct = Math.round(score / data.length * 100);
    finalBox.textContent = `Итог: ${score} из ${data.length} (${pct}%). ` +
      (pct >= 80 ? 'Отличный результат!' : pct >= 60 ? 'Хорошо, но можно лучше.' : 'Стоит повторить материал.');
  }
}

document.getElementById('showAllBtn').addEventListener('click', () => {
  document.querySelectorAll('.q').forEach(qDiv => {
    const idx = Array.from(quiz.children).indexOf(qDiv);
    const correct = data[idx][2];
    qDiv.querySelectorAll('.answer').forEach(a => {
      a.classList.add('disabled');
      a.classList.remove('wrong', 'selected');
      if (Number(a.dataset.idx) === correct) a.classList.add('correct');
    });
    if (qDiv.dataset.done !== '1') {
      qDiv.dataset.done = '1';
      answeredCount++;
      answeredEl.textContent = answeredCount;
    }
  });
  if (answeredCount === data.length && score + errors === 0) {
    finalBox.textContent = 'Все правильные ответы показаны. Счёт не начислялся — это режим просмотра.';
  }
});

document.getElementById('restartBtn').addEventListener('click', build);
build();
</script>
